name: me-rupp

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/${BACKEND_ENV_FILE:-.env.production}
    environment:
      DJANGO_SETTINGS_MODULE: me_backend.settings.production
    expose:
      - "8000"
    volumes:
      - ./backend/src/db.sqlite3:/app/db.sqlite3
      - ./backend/src/media:/app/media
      - django_static:/app/static
      - django_secrets:/run/me-secrets
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': 'localhost', 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_HTTP_PORT:-8080}:80"
    volumes:
      - ./backend/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/srv/static:ro
      - ./backend/src/media:/srv/media:ro

volumes:
  django_static:
  django_secrets:
