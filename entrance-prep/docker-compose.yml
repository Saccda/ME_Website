# Pinned so `docker compose` here needs no -p flag, and so the project name
# never silently follows a directory rename.
#
# Changing it is a migration, not an edit: the project name is what Compose
# attaches the volume to, so a new name means a new, empty database while the
# old one sits in the old volume looking lost. It was changed from
# "logic-studio" while the database still held nothing but the question bank,
# one teacher and one blueprint -- all three of which rebuild on startup. Do
# not change it again once students have accounts; copy the volume instead.
name: entrance-prep
services:
  database:
    image: postgres:17-alpine
    environment:
      # Still "logic" on purpose. It is invisible outside the container, and
      # renaming it would mean editing the DSN and the healthcheck too -- three
      # more chances to typo something that stops the stack booting, for no
      # benefit anyone can see.
      POSTGRES_DB: logic
      POSTGRES_USER: logic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    # The default limit is 100, which api workers x their pools would exhaust.
    # Keep it above API_WORKERS x (DB_POOL_SIZE + DB_MAX_OVERFLOW).
    command: postgres -c max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U logic -d logic]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://logic:${POSTGRES_PASSWORD}@database:5432/logic
      # "open" means no sign-in at all, and Teacher studio -- including every
      # answer key -- is reachable by any visitor. Anything other than "open"
      # requires an account and gates the studio by role.
      AUTH_MODE: ${AUTH_MODE:-site}
      # Required once AUTH_MODE is not "open" and DEMO_MODE is false: the first
      # teacher is created from these at startup. Without them the API refuses
      # to start, because there would be no way to review or approve anything.
      TEACHER_EMAIL: ${TEACHER_EMAIL:?Set TEACHER_EMAIL}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:?Set TEACHER_PASSWORD, at least 12 characters}
      DEMO_MODE: 'false'
      DB_AUTO_CREATE: 'false'
      # Keep true in front of students. A Secure cookie is not stored over plain
      # HTTP, so a local test on http://127.0.0.1 must set this false or sign-in
      # fails silently -- the request succeeds and the session simply vanishes.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      # Optional. Empty means the sign-in screen offers no password reset,
      # rather than offering one that cannot send.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Endpoints are synchronous and hold one connection each, so the request
      # thread pool is matched to this. Keep (size + overflow) x api replicas
      # below PostgreSQL's max_connections, which defaults to 100.
      # Measured: capacity tracks the pool, because a request holds its
      # connection for its whole life. A pool of 30 collapsed at 25 students
      # loading the workspace; 120 carried 60. Four workers x 70 gives 280
      # concurrent slots, under the 300 connections PostgreSQL is started with.
      WEB_CONCURRENCY: ${API_WORKERS:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-50}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
    volumes:
      # Read-only, and solely so tools/import_exam_bank.py can find the
      # examination panel's bank, which is kept out of the repository because
      # the GitHub remote is public. Nothing under app/ reads this path and no
      # route serves it -- only that tool opens it, and only when run by hand.
      - ./private:/app/private:ro
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_URL: http://api:8000
    ports:
      # Configurable so this stack cannot collide with anything already bound
      # on the host, such as another project's web container.
      - 127.0.0.1:${WEB_PORT:-3000}:3000
    depends_on:
      - api
    restart: unless-stopped
volumes:
  data:
